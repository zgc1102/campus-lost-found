<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#3B1D63" />
    <title>清华校园拾光里 v3.2.2 · 校园互助服务平台</title>
    <style>
      html, body { margin: 0; background: #140a22; }
      body { overflow: hidden; }
      #loading { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 35%, rgba(200,169,106,.14), transparent 34%), linear-gradient(155deg,#140a22,#2b1645 58%,#4b2477); color: #fff; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; transition: opacity .35s ease; }
      #loading.leaving { opacity: 0; pointer-events: none; }
      .loading-card { text-align: center; padding: 28px; }
      .loading-mark { width: 56px; height: 56px; margin: 0 auto 14px; border: 1px solid rgba(232,205,142,.55); border-radius: 16px; display: grid; place-items: center; color: #e8cd8e; font-size: 27px; }
      .loading-spinner { width: 24px; height: 24px; margin: 0 auto 13px; border: 3px solid rgba(232,205,142,.25); border-top-color: #e8cd8e; border-radius: 50%; animation: loadingSpin .8s linear infinite; }
      .loading-card h1 { margin: 0; color: #e8cd8e; font-size: 18px; font-weight: 600; letter-spacing: .12em; }
      .loading-card p { margin: 9px 0 0; color: rgba(255,255,255,.55); font-size: 11px; line-height: 1.8; }
      @keyframes loadingSpin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" crossorigin src="/web/assets/index-BjJR5xcf.js"></script>
    <link rel="stylesheet" crossorigin href="/web/assets/index-Cz8XZb7O.css">
  </head>
  <body>
    <div id="loading"><div class="loading-card"><div class="loading-mark">拾</div><div class="loading-spinner"></div><h1>拾光里</h1><p>还没加载好，请耐心等待一下…</p></div></div>
    <div id="app"></div>
    <script>
      (function () {
        var el = document.getElementById('loading');
        if (!el) return;
        var done = false;
        function hide() {
          if (done) return;
          done = true;
          el.classList.add('leaving');
          document.body.style.overflow = '';
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 380);
        }
        window.addEventListener('sg:app-ready', hide, { once: true });
        // 极端情况下，页面已经挂载但事件没派发，不能永远挡住。
        setTimeout(function () {
          if (document.querySelector('#app .admin-shell, #app .phone, #app .admin-route')) hide();
        }, 12000);
      })();
    </script>
  </body>
</html>
