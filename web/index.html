<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#3B1D63" />
    <title>清华校园拾光里 v3.2.2 · 校园互助服务平台</title>
    <style>
      html, body { margin: 0; background: #F3EEFA; }
      .boot-shell { min-height: 100vh; display: flex; justify-content: center; background: #F3EEFA; color: #3B1D63; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .boot-phone { width: 390px; max-width: 100%; min-height: 100vh; background: #F6F1FB; display: flex; flex-direction: column; position: relative; overflow: hidden; }
      .boot-ticker { height: 22px; display: flex; align-items: center; background: #F7F0FF; color: #8A6AA8; font-size: 10px; padding: 0 10px; white-space: nowrap; overflow: hidden; }
      .boot-topbar { height: 52px; display: flex; align-items: center; gap: 7px; padding: 0 10px; background: #5B2A91; color: #fff; flex: none; }
      .boot-search { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.65); display: flex; align-items: center; justify-content: center; font-size: 17px; }
      .boot-title { flex: 1; font-size: 15px; font-weight: 700; letter-spacing: .3px; }
      .boot-title small { font-size: 8px; font-weight: 400; opacity: .65; margin-left: 3px; }
      .boot-round { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.65); display: flex; align-items: center; justify-content: center; font-size: 14px; }
      .boot-scroll { flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
      .boot-mem { border-radius: 14px; padding: 13px 14px; background: linear-gradient(135deg, #4A1B72, #6A329D); color: #fff; display: flex; align-items: center; gap: 11px; box-shadow: 0 8px 22px rgba(74,27,114,.18); }
      .boot-star { width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,.15); display: flex; align-items: center; justify-content: center; font-size: 17px; }
      .boot-mem b { display: block; font-size: 12px; font-weight: 600; }
      .boot-mem span { display: block; margin-top: 3px; font-size: 9px; color: rgba(255,255,255,.7); }
      .boot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
      .boot-card { background: #fff; border: 1px solid #EDE3F8; border-radius: 13px; padding: 12px; min-height: 82px; display: flex; flex-direction: column; justify-content: space-between; }
      .boot-card .dot { width: 28px; height: 28px; border-radius: 9px; background: #F1E8FB; }
      .boot-card b { font-size: 11px; color: #4B2D6B; }
      .boot-card span { font-size: 9px; color: #9B8AAC; }
      .boot-skeleton { height: 8px; border-radius: 5px; background: #F1E8FB; margin-top: 8px; }
      .boot-loading { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 0 2px; color: #8E7FA3; font-size: 10px; }
      .boot-spinner { width: 15px; height: 15px; border: 2px solid #E6D9F4; border-top-color: #5B2A91; border-radius: 50%; animation: bootSpin .8s linear infinite; }
      .boot-nav { height: 58px; flex: none; background: #fff; border-top: 1px solid #EDE3F8; display: flex; align-items: center; justify-content: space-around; color: #8E7FA3; font-size: 10px; }
      .boot-nav span { display: flex; flex-direction: column; align-items: center; gap: 3px; }
      .boot-nav i { width: 18px; height: 18px; border-radius: 6px; background: #F1E8FB; display: block; }
      .boot-nav .on { color: #5B2A91; font-weight: 600; }
      @keyframes bootSpin { to { transform: rotate(360deg); } }
      @media (max-width: 759px) { .boot-phone { width: 100%; } }

      /* 首屏介绍动画：独立于 Vue，慢网络时也能立即出现 */
      #intro { position: fixed; inset: 0; z-index: 9999; overflow: hidden; color: #fff; background: radial-gradient(circle at 78% 18%, rgba(200,169,106,.20), transparent 34%), linear-gradient(155deg,#160b25 0%,#2b1645 46%,#4b2477 100%); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      #intro.is-leaving { opacity: 0; transition: opacity .55s ease; pointer-events: none; }
      .intro-noise { position: absolute; inset: 0; opacity: .16; background-image: radial-gradient(rgba(255,255,255,.35) .6px, transparent .6px); background-size: 5px 5px; pointer-events: none; }
      .intro-glow { position: absolute; width: 460px; height: 460px; border-radius: 50%; filter: blur(30px); opacity: .22; pointer-events: none; }
      .intro-glow.a { left: -180px; bottom: -160px; background: #8a52c7; }
      .intro-glow.b { right: -170px; top: -150px; background: #c8a96a; }
      .intro-head { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 22px 26px; z-index: 3; }
      .intro-brand { display: flex; align-items: center; gap: 10px; letter-spacing: .16em; font-size: 11px; color: rgba(255,255,255,.72); }
      .intro-mark { width: 30px; height: 30px; border: 1px solid rgba(232,205,142,.55); border-radius: 9px; display: grid; place-items: center; color: #e8cd8e; font-size: 15px; }
      .intro-skip { border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.06); color: rgba(255,255,255,.78); border-radius: 99px; padding: 7px 14px; font: inherit; font-size: 10px; letter-spacing: .1em; cursor: pointer; }
      .intro-stage { position: relative; height: 100%; max-width: 760px; margin: 0 auto; padding: 82px 28px 74px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
      .intro-scene { position: absolute; left: 28px; right: 28px; top: 50%; transform: translateY(-44%); opacity: 0; visibility: hidden; transition: opacity .55s ease, transform .55s ease, visibility .55s; text-align: center; }
      .intro-scene.on { opacity: 1; visibility: visible; transform: translateY(-50%); }
      .intro-kicker { display: inline-flex; align-items: center; gap: 8px; color: #d9bf82; font-size: 10px; letter-spacing: .28em; text-transform: uppercase; margin-bottom: 18px; }
      .intro-kicker::before { content: ''; width: 24px; height: 1px; background: #c8a96a; opacity: .8; }
      .intro-title { margin: 0; font-size: clamp(28px, 5.4vw, 48px); line-height: 1.25; font-weight: 700; letter-spacing: .02em; color: #fffaf0; text-shadow: 0 2px 24px rgba(0,0,0,.18); }
      .intro-title em { font-style: normal; color: #e8cd8e; }
      .intro-sub { margin: 18px auto 0; max-width: 560px; color: rgba(255,255,255,.68); font-size: 13px; line-height: 1.9; }
      .intro-items { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 26px 0 4px; }
      .intro-item { min-width: 78px; padding: 14px 13px 12px; border: 1px solid rgba(255,255,255,.16); border-radius: 13px; background: rgba(255,255,255,.07); backdrop-filter: blur(8px); color: rgba(255,255,255,.84); font-size: 11px; animation: introFloat 4.2s ease-in-out infinite; }
      .intro-item:nth-child(2) { animation-delay: -.8s; }
      .intro-item:nth-child(3) { animation-delay: -1.6s; }
      .intro-item:nth-child(4) { animation-delay: -2.4s; }
      .intro-item b { display: block; font-size: 21px; margin-bottom: 5px; }
      .intro-bubbles { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 24px 0 0; }
      .intro-bubble { max-width: 230px; padding: 12px 14px; border-radius: 13px; font-size: 12px; line-height: 1.6; text-align: left; color: rgba(255,255,255,.8); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); }
      .intro-bubble b { color: #e8cd8e; font-weight: 500; }
      .intro-features { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; max-width: 520px; margin: 24px auto 0; text-align: left; }
      .intro-feature { padding: 11px 13px; border-radius: 10px; border: 1px solid rgba(232,205,142,.18); background: rgba(255,255,255,.055); color: rgba(255,255,255,.78); font-size: 11px; line-height: 1.55; }
      .intro-feature b { color: #e8cd8e; display: block; margin-bottom: 2px; font-size: 11px; }
      .intro-sponsors { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 560px; margin: 22px auto 0; }
      .intro-sponsor { padding: 14px; border: 1px solid rgba(255,255,255,.14); border-radius: 12px; background: rgba(255,255,255,.06); text-align: left; }
      .intro-sponsor b { display: block; font-size: 12px; color: #fff8e8; margin-bottom: 5px; }
      .intro-sponsor span { display: block; font-size: 10px; line-height: 1.6; color: rgba(255,255,255,.58); }
      .intro-enter { margin-top: 26px; border: 1px solid rgba(232,205,142,.7); border-radius: 99px; background: linear-gradient(100deg,#c8a96a,#f3dfac,#c8a96a); color: #2b1645; padding: 12px 30px; font: inherit; font-size: 12px; font-weight: 700; letter-spacing: .1em; cursor: pointer; box-shadow: 0 10px 28px rgba(200,169,106,.22); }
      .intro-foot { position: absolute; left: 0; right: 0; bottom: 24px; z-index: 3; text-align: center; color: rgba(255,255,255,.36); font-size: 9px; letter-spacing: .08em; }
      .intro-dots { display: flex; justify-content: center; gap: 6px; margin-top: 20px; }
      .intro-dots i { width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,.25); transition: .25s; }
      .intro-dots i.on { width: 16px; border-radius: 99px; background: #c8a96a; }
      @keyframes introFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @media (max-width: 520px) { .intro-stage { padding-left: 18px; padding-right: 18px; } .intro-scene { left: 18px; right: 18px; } .intro-sponsors { grid-template-columns: 1fr; } .intro-features { grid-template-columns: 1fr; } .intro-head { padding: 16px 18px; } }
      @media (prefers-reduced-motion: reduce) { .intro-item, .intro-scene, #intro.is-leaving { animation: none !important; transition: none !important; } }

      #welcome { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 30%, rgba(200,169,106,.15), transparent 36%), linear-gradient(155deg,#140a22,#2b1645 55%,#4b2477); color: #fff; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; animation: welcomeIn .4s ease both; }
      #welcome.leaving { opacity: 0; transition: opacity .45s ease; pointer-events: none; }
      .welcome-card { width: min(360px, calc(100% - 40px)); text-align: center; padding: 34px 26px 26px; border: 1px solid rgba(232,205,142,.26); border-radius: 22px; background: rgba(255,255,255,.055); box-shadow: 0 28px 80px rgba(0,0,0,.35); backdrop-filter: blur(10px); }
      .welcome-mark { width: 58px; height: 58px; margin: 0 auto 15px; border: 1px solid rgba(232,205,142,.55); border-radius: 16px; display: grid; place-items: center; color: #e8cd8e; font-size: 27px; }
      .welcome-kicker { color: rgba(232,205,142,.7); font-size: 8px; letter-spacing: .24em; }
      .welcome-card h1 { margin: 12px 0 0; color: #fff8e8; font-size: 23px; line-height: 1.45; font-weight: 700; }
      .welcome-card p { margin: 10px 0 0; color: rgba(255,255,255,.58); font-size: 11px; line-height: 1.9; }
      .welcome-enter { margin-top: 22px; width: 100%; border: 1px solid rgba(232,205,142,.7); border-radius: 99px; background: linear-gradient(100deg,#c8a96a,#f3dfac,#c8a96a); color: #2b1645; padding: 11px 18px; font: inherit; font-size: 12px; font-weight: 700; letter-spacing: .08em; cursor: pointer; }
      .welcome-skip { margin-top: 9px; border: 0; background: transparent; color: rgba(255,255,255,.45); font: inherit; font-size: 9px; cursor: pointer; }
      @keyframes welcomeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
  </head>

  <body>
    <div id="welcome" role="dialog" aria-label="欢迎来到拾光里">
      <div class="welcome-card">
        <div class="welcome-mark">拾</div>
        <div class="welcome-kicker">CAMPUS LOST &amp; FOUND</div>
        <h1>嗨，欢迎来到拾光里</h1>
        <p>校园失物招领与爱心互助平台<br>不交易 · 不收费 · 让每件失物都有回家的路</p>
        <button type="button" class="welcome-enter" id="welcome-enter" onclick="var w=document.getElementById('welcome');if(w){w.remove();document.body.style.overflow='';}">开始探索 →</button>
        <button type="button" class="welcome-skip" id="welcome-skip" onclick="var w=document.getElementById('welcome');if(w){w.remove();document.body.style.overflow='';}">跳过</button>
      </div>
    </div>
    <div id="app"></div>
    <script>
      (function () {
        var w = document.getElementById('welcome');
        if (!w) return;
        var admin = location.pathname.replace(/\/+$/, '') === '/admin';
        if (admin) { w.remove(); return; }
        document.body.style.overflow = 'hidden';
        var closed = false;
        function close() {
          if (closed) return;
          closed = true;
          document.body.style.overflow = '';
          w.classList.add('leaving');
          setTimeout(function () { if (w.parentNode) w.parentNode.removeChild(w); }, 500);
        }
        document.getElementById('welcome-enter').addEventListener('click', close);
        document.getElementById('welcome-skip').addEventListener('click', close);
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
        setTimeout(close, 4200);
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
