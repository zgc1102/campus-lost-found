<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#3B1D63" />
    <title>清华校园拾光里 v3.2.2 · 校园互助服务平台</title>
    <style>
      html, body { margin: 0; background: #F3EEFA; }
      .boot-shell { min-height: 100vh; display: flex; justify-content: center; background: #F3EEFA; color: #3B1D63; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .boot-phone { width: 390px; max-width: 100%; min-height: 100vh; background: #F6F1FB; display: flex; flex-direction: column; position: relative; overflow: hidden; }
      .boot-ticker { height: 22px; display: flex; align-items: center; background: #F7F0FF; color: #8A6AA8; font-size: 10px; padding: 0 10px; white-space: nowrap; overflow: hidden; }
      .boot-topbar { height: 52px; display: flex; align-items: center; gap: 7px; padding: 0 10px; background: #5B2A91; color: #fff; flex: none; }
      .boot-search { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.65); display: flex; align-items: center; justify-content: center; font-size: 17px; }
      .boot-title { flex: 1; font-size: 15px; font-weight: 700; letter-spacing: .3px; }
      .boot-title small { font-size: 8px; font-weight: 400; opacity: .65; margin-left: 3px; }
      .boot-round { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.65); display: flex; align-items: center; justify-content: center; font-size: 14px; }
      .boot-scroll { flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
      .boot-mem { border-radius: 14px; padding: 13px 14px; background: linear-gradient(135deg, #4A1B72, #6A329D); color: #fff; display: flex; align-items: center; gap: 11px; box-shadow: 0 8px 22px rgba(74,27,114,.18); }
      .boot-star { width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,.15); display: flex; align-items: center; justify-content: center; font-size: 17px; }
      .boot-mem b { display: block; font-size: 12px; font-weight: 600; }
      .boot-mem span { display: block; margin-top: 3px; font-size: 9px; color: rgba(255,255,255,.7); }
      .boot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
      .boot-card { background: #fff; border: 1px solid #EDE3F8; border-radius: 13px; padding: 12px; min-height: 82px; display: flex; flex-direction: column; justify-content: space-between; }
      .boot-card .dot { width: 28px; height: 28px; border-radius: 9px; background: #F1E8FB; }
      .boot-card b { font-size: 11px; color: #4B2D6B; }
      .boot-card span { font-size: 9px; color: #9B8AAC; }
      .boot-skeleton { height: 8px; border-radius: 5px; background: #F1E8FB; margin-top: 8px; }
      .boot-loading { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 0 2px; color: #8E7FA3; font-size: 10px; }
      .boot-spinner { width: 15px; height: 15px; border: 2px solid #E6D9F4; border-top-color: #5B2A91; border-radius: 50%; animation: bootSpin .8s linear infinite; }
      .boot-nav { height: 58px; flex: none; background: #fff; border-top: 1px solid #EDE3F8; display: flex; align-items: center; justify-content: space-around; color: #8E7FA3; font-size: 10px; }
      .boot-nav span { display: flex; flex-direction: column; align-items: center; gap: 3px; }
      .boot-nav i { width: 18px; height: 18px; border-radius: 6px; background: #F1E8FB; display: block; }
      .boot-nav .on { color: #5B2A91; font-weight: 600; }
      @keyframes bootSpin { to { transform: rotate(360deg); } }
      @media (max-width: 759px) { .boot-phone { width: 100%; } }

      /* 首屏动画电影：独立于 Vue，网络慢时立即出现 */
      #intro { position: fixed; inset: 0; z-index: 9999; overflow: hidden; background: #140a22; color: #fff; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      #intro.is-leaving { opacity: 0; transition: opacity .6s ease; pointer-events: none; }
      .intro-sky { position: absolute; inset: 0; background: radial-gradient(circle at 74% 20%, rgba(200,169,106,.20), transparent 34%), radial-gradient(circle at 15% 80%, rgba(138,82,199,.24), transparent 42%), linear-gradient(155deg,#12081f 0%,#25123c 48%,#3b1b5c 100%); }
      .intro-sky::after { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.3) .55px, transparent .55px); background-size: 5px 5px; opacity: .12; }
      .intro-map { position: absolute; left: 50%; top: 50%; width: min(1160px, 150vw); height: auto; transform: translate(-50%,-50%) scale(1.03); opacity: .38; transition: transform 2.4s ease, opacity 1.2s ease; }
      #intro[data-act="2"] .intro-map { transform: translate(-50%,-50%) scale(1.12) translateY(-1.5%); }
      #intro[data-act="3"] .intro-map { transform: translate(-50%,-50%) scale(1.2) translateY(-2%); opacity: .28; }
      #intro[data-act="4"] .intro-map { transform: translate(-50%,-50%) scale(1.34) translateY(-3%); opacity: .22; }
      #intro[data-act="5"] .intro-map { transform: translate(-50%,-50%) scale(1.42); opacity: .18; }
      .intro-map .road { fill: none; stroke: rgba(232,205,142,.34); stroke-width: 1.2; stroke-dasharray: 7 9; animation: roadFlow 18s linear infinite; }
      .intro-map .road.bright { stroke: rgba(232,205,142,.62); stroke-width: 2; }
      .intro-map .building { fill: rgba(255,255,255,.06); stroke: rgba(232,205,142,.28); stroke-width: 1.2; }
      .intro-map .building.b { fill: rgba(138,82,199,.18); }
      .intro-map .pin { fill: #e8cd8e; opacity: .7; animation: pinPulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .intro-vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 35%, rgba(11,5,19,.55) 100%); pointer-events: none; }
      .intro-head { position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: 22px 28px; }
      .intro-brand { display: flex; align-items: center; gap: 10px; font-size: 10px; letter-spacing: .18em; color: rgba(255,255,255,.56); }
      .intro-brandmark { width: 28px; height: 28px; border: 1px solid rgba(232,205,142,.5); border-radius: 8px; display: grid; place-items: center; color: #e8cd8e; font-size: 14px; }
      .intro-skip { border: 1px solid rgba(255,255,255,.24); border-radius: 99px; background: rgba(255,255,255,.05); color: rgba(255,255,255,.76); padding: 7px 14px; font: inherit; font-size: 10px; letter-spacing: .08em; cursor: pointer; }
      .intro-skip:hover { border-color: rgba(232,205,142,.6); color: #e8cd8e; }
      .intro-film { position: absolute; inset: 0; z-index: 4; max-width: 1180px; margin: 0 auto; }
      .intro-act { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: opacity .65s ease, visibility .65s ease; }
      #intro[data-act="1"] .act-1, #intro[data-act="2"] .act-2, #intro[data-act="3"] .act-3, #intro[data-act="4"] .act-4, #intro[data-act="5"] .act-5 { opacity: 1; visibility: visible; }
      .act-copy { position: absolute; left: clamp(24px, 7vw, 96px); bottom: clamp(84px, 13vh, 132px); max-width: 580px; z-index: 4; }
      .intro-kicker { display: flex; align-items: center; gap: 9px; color: #d9bf82; font-size: 9px; letter-spacing: .28em; text-transform: uppercase; margin-bottom: 14px; }
      .intro-kicker::before { content: ''; width: 26px; height: 1px; background: #c8a96a; }
      .act-copy h1 { margin: 0; font-size: clamp(27px, 4.4vw, 48px); line-height: 1.24; font-weight: 700; letter-spacing: .015em; color: #fffaf0; }
      .act-copy h1 em { font-style: normal; color: #e8cd8e; }
      .act-copy p { margin: 15px 0 0; max-width: 480px; color: rgba(255,255,255,.6); font-size: 12px; line-height: 1.9; }
      .floating-items { position: absolute; right: clamp(20px, 9vw, 132px); top: 50%; width: min(390px, 40vw); height: 300px; transform: translateY(-50%); }
      .lost-item { position: absolute; min-width: 76px; padding: 11px 10px; border: 1px solid rgba(255,255,255,.18); border-radius: 12px; background: rgba(255,255,255,.07); backdrop-filter: blur(8px); text-align: center; color: rgba(255,255,255,.78); font-size: 9px; box-shadow: 0 12px 26px rgba(0,0,0,.16); animation: itemDrift 5s ease-in-out infinite; }
      .lost-item b { display: block; font-size: 25px; margin-bottom: 3px; font-weight: 400; }
      .lost-item.i1 { left: 12%; top: 8%; animation-delay: -.4s; }
      .lost-item.i2 { right: 6%; top: 27%; animation-delay: -1.6s; }
      .lost-item.i3 { left: 28%; bottom: 10%; animation-delay: -2.8s; }
      .lost-item.i4 { right: 21%; bottom: 2%; animation-delay: -3.6s; }
      .lost-item::after { content: ''; position: absolute; inset: -5px; border: 1px solid rgba(232,205,142,.28); border-radius: 15px; opacity: 0; animation: itemRing 3s ease-out infinite; }
      .phone-wrap { position: absolute; right: clamp(20px, 12vw, 174px); top: 50%; transform: translateY(-50%) rotate(-4deg); width: 228px; height: 390px; border-radius: 28px; border: 1px solid rgba(232,205,142,.5); background: linear-gradient(160deg,#2c1748,#160c26); box-shadow: 0 30px 80px rgba(0,0,0,.42); padding: 10px; transition: transform 1.2s ease; }
      #intro[data-act="2"] .phone-wrap { animation: phoneFloat 5s ease-in-out infinite; }
      .phone-screen { height: 100%; border-radius: 20px; background: #f7f2fb; overflow: hidden; padding: 14px 10px; display: flex; flex-direction: column; gap: 8px; }
      .phone-head { display: flex; align-items: center; gap: 6px; color: #5b2a91; font-size: 9px; font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid #eadff5; }
      .phone-head i { width: 18px; height: 18px; border-radius: 6px; background: #5b2a91; color: #fff; font-style: normal; display: grid; place-items: center; font-size: 9px; }
      .chat-line { max-width: 88%; padding: 8px 9px; border-radius: 10px; font-size: 9px; line-height: 1.55; color: #5c4b70; background: #fff; border: 1px solid #eee4f8; opacity: 0; transform: translateY(9px) scale(.96); }
      .chat-line.them { align-self: flex-start; }
      .chat-line.me { align-self: flex-end; background: #5b2a91; color: #fff; border-color: #5b2a91; }
      #intro[data-act="2"] .chat-line { animation: chatPop .5s ease forwards; }
      #intro[data-act="2"] .chat-line:nth-child(2) { animation-delay: .25s; }
      #intro[data-act="2"] .chat-line:nth-child(3) { animation-delay: .75s; }
      #intro[data-act="2"] .chat-line:nth-child(4) { animation-delay: 1.25s; }
      #intro[data-act="2"] .chat-line:nth-child(5) { animation-delay: 1.75s; }
      .phone-typing { margin-top: auto; color: #a794b9; font-size: 8px; display: flex; align-items: center; gap: 5px; }
      .phone-typing i { width: 4px; height: 4px; border-radius: 50%; background: #a794b9; animation: typing 1s ease-in-out infinite; }
      .phone-typing i:nth-child(2) { animation-delay: .15s; } .phone-typing i:nth-child(3) { animation-delay: .3s; }
      .match-stage { position: absolute; right: clamp(20px, 8vw, 120px); top: 50%; width: 440px; height: 270px; transform: translateY(-50%); }
      .match-card { position: absolute; width: 172px; padding: 14px; border-radius: 14px; border: 1px solid rgba(232,205,142,.4); background: rgba(255,255,255,.08); box-shadow: 0 16px 40px rgba(0,0,0,.2); color: rgba(255,255,255,.75); font-size: 9px; line-height: 1.6; transition: transform 1.1s cubic-bezier(.2,.8,.2,1), opacity .6s; }
      .match-card b { display: block; color: #fff8e8; font-size: 13px; margin: 4px 0; }
      .match-card small { color: #d9bf82; font-size: 8px; letter-spacing: .08em; }
      .match-card.lost { left: 0; top: 20px; transform: translateX(-30px) rotate(-5deg); opacity: 0; }
      .match-card.found { right: 0; bottom: 16px; transform: translateX(30px) rotate(5deg); opacity: 0; }
      #intro[data-act="3"] .match-card.lost { transform: translateX(0) rotate(-3deg); opacity: 1; }
      #intro[data-act="3"] .match-card.found { transform: translateX(0) rotate(3deg); opacity: 1; }
      .match-line { position: absolute; left: 50%; top: 50%; width: 120px; height: 110px; transform: translate(-50%,-50%); overflow: visible; }
      .match-line path { fill: none; stroke: #e8cd8e; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 180; stroke-dashoffset: 180; filter: drop-shadow(0 0 8px rgba(232,205,142,.45)); }
      #intro[data-act="3"] .match-line path { animation: drawMatch 1.3s .6s ease forwards; }
      .match-badge { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) scale(.8); border: 1px solid rgba(232,205,142,.6); background: #2b1645; color: #e8cd8e; border-radius: 99px; padding: 7px 12px; font-size: 9px; letter-spacing: .08em; opacity: 0; }
      #intro[data-act="3"] .match-badge { opacity: 1; transform: translate(-50%,-50%) scale(1); transition: .4s 1.5s; }
      .scan-stage { position: absolute; right: clamp(20px, 11vw, 160px); top: 50%; width: 260px; height: 260px; transform: translateY(-50%); display: grid; place-items: center; }
      .scan-ring { position: absolute; width: 215px; height: 215px; border: 1px solid rgba(232,205,142,.36); border-radius: 50%; box-shadow: inset 0 0 30px rgba(232,205,142,.08); }
      .scan-ring::before { content: ''; position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(232,205,142,.3); animation: ringSpin 10s linear infinite; }
      .scan-ring::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0 72%, rgba(232,205,142,.7) 80%, transparent 88%); animation: ringSpin 2.8s linear infinite; mask: radial-gradient(circle, transparent 64%, #000 65%); }
      .scan-core { width: 112px; height: 112px; border-radius: 50%; border: 1px solid rgba(232,205,142,.5); background: radial-gradient(circle, rgba(200,169,106,.2), rgba(43,22,69,.8)); display: grid; place-items: center; color: #e8cd8e; font-size: 27px; box-shadow: 0 0 45px rgba(200,169,106,.18); }
      .scan-tag { position: absolute; border: 1px solid rgba(255,255,255,.15); border-radius: 8px; background: rgba(255,255,255,.06); color: rgba(255,255,255,.7); padding: 6px 8px; font-size: 8px; }
      .scan-tag.t1 { left: -12px; top: 38px; } .scan-tag.t2 { right: -18px; bottom: 32px; }
      .feature-row { position: absolute; left: clamp(24px,7vw,96px); right: clamp(24px,7vw,96px); bottom: clamp(74px,12vh,120px); display: flex; gap: 8px; flex-wrap: wrap; max-width: 520px; }
      .feature-chip { border: 1px solid rgba(232,205,142,.2); border-radius: 8px; background: rgba(255,255,255,.05); color: rgba(255,255,255,.64); padding: 8px 9px; font-size: 9px; line-height: 1.5; }
      .feature-chip b { color: #e8cd8e; display: block; font-size: 9px; margin-bottom: 2px; }
      .final-stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 84px 24px 94px; }
      .final-mark { width: 68px; height: 68px; border: 1px solid rgba(232,205,142,.55); border-radius: 18px; display: grid; place-items: center; color: #e8cd8e; font-size: 30px; background: rgba(255,255,255,.04); box-shadow: 0 0 50px rgba(200,169,106,.14); animation: markGlow 3s ease-in-out infinite; }
      .final-title { margin: 18px 0 0; font-size: clamp(31px,5vw,52px); letter-spacing: .08em; color: #fff8e8; font-weight: 700; }
      .final-sub { margin: 10px 0 0; color: rgba(255,255,255,.55); font-size: 10px; letter-spacing: .1em; }
      .sponsor-row { display: flex; gap: 9px; flex-wrap: wrap; justify-content: center; margin-top: 26px; }
      .sponsor-card { border: 1px solid rgba(255,255,255,.12); border-radius: 9px; background: rgba(255,255,255,.04); padding: 9px 13px; color: rgba(255,255,255,.58); font-size: 9px; text-align: left; }
      .sponsor-card b { display: block; color: #e8cd8e; font-size: 10px; font-weight: 500; margin-bottom: 3px; }
      .enter-btn { margin-top: 28px; border: 1px solid rgba(232,205,142,.65); border-radius: 99px; background: linear-gradient(100deg,#c8a96a,#f3dfac,#c8a96a); color: #2b1645; padding: 11px 28px; font: inherit; font-size: 11px; font-weight: 700; letter-spacing: .1em; cursor: pointer; box-shadow: 0 12px 30px rgba(200,169,106,.18); transition: transform .2s ease, box-shadow .2s ease; }
      .enter-btn:hover { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(200,169,106,.26); }
      .intro-progress { position: absolute; left: 28px; right: 28px; bottom: 26px; height: 1px; background: rgba(255,255,255,.12); z-index: 6; overflow: hidden; }
      .intro-progress i { display: block; height: 100%; width: 0; background: #c8a96a; transition: width .5s linear; }
      .intro-foot { position: absolute; left: 28px; bottom: 9px; z-index: 6; color: rgba(255,255,255,.28); font-size: 8px; letter-spacing: .12em; }
      @keyframes roadFlow { to { stroke-dashoffset: -160; } }
      @keyframes pinPulse { 0%,100% { opacity:.35; transform:scale(.85); } 50% { opacity:1; transform:scale(1.15); } }
      @keyframes itemDrift { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-9px) rotate(2deg); } }
      @keyframes itemRing { 0% { opacity:.4; transform:scale(.82); } 70%,100% { opacity:0; transform:scale(1.18); } }
      @keyframes chatPop { to { opacity:1; transform:translateY(0) scale(1); } }
      @keyframes typing { 0%,100% { opacity:.25; } 50% { opacity:1; } }
      @keyframes phoneFloat { 0%,100% { transform:translateY(-50%) rotate(-4deg); } 50% { transform:translateY(calc(-50% - 7px)) rotate(-2deg); } }
      @keyframes drawMatch { to { stroke-dashoffset: 0; } }
      @keyframes ringSpin { to { transform: rotate(360deg); } }
      @keyframes markGlow { 0%,100% { box-shadow:0 0 40px rgba(200,169,106,.1); } 50% { box-shadow:0 0 70px rgba(200,169,106,.26); } }
      @media (max-width: 760px) {
        .floating-items, .phone-wrap, .match-stage, .scan-stage { right: -40px; opacity: .45; transform: translateY(-50%) scale(.8); transform-origin: center; }
        .act-copy { bottom: 92px; left: 22px; right: 22px; max-width: none; }
        .act-copy p { max-width: 92%; }
        .feature-row { left: 22px; right: 22px; bottom: 88px; }
        .match-stage { width: 330px; height: 230px; right: -30px; opacity: .7; }
        .match-card { width: 142px; padding: 10px; font-size: 8px; }
        .phone-wrap { width: 180px; height: 310px; right: -14px; opacity: .65; }
        .scan-stage { width: 220px; height: 220px; right: -34px; opacity: .55; }
        .sponsor-row { margin-top: 18px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .intro-map .road, .intro-map .pin, .lost-item, .lost-item::after, .scan-ring::before, .scan-ring::after, .final-mark { animation: none !important; }
      }

      .intro-video { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; object-fit: cover; background: #140a22; }
      .intro-play { display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 4; border: 1px solid rgba(232,205,142,.7); border-radius: 99px; background: rgba(20,10,34,.78); color: #e8cd8e; padding: 13px 24px; font: inherit; font-size: 12px; letter-spacing: .08em; cursor: pointer; backdrop-filter: blur(6px); }
      #intro.need-play .intro-play { display: block; }
      .intro-fallback { position: absolute; inset: 0; z-index: 3; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: radial-gradient(circle at 50% 35%, rgba(200,169,106,.12), transparent 40%), linear-gradient(155deg,#140a22,#2b1645); padding: 30px; }
      #intro.fallback-on .intro-fallback { display: flex; }
      .fallback-mark { width: 70px; height: 70px; border: 1px solid rgba(232,205,142,.6); border-radius: 20px; display: grid; place-items: center; color: #e8cd8e; font-size: 32px; margin-bottom: 18px; }
      .intro-fallback h1 { margin: 0; color: #e8cd8e; font-size: clamp(34px,5vw,58px); letter-spacing: .12em; }
      .intro-fallback p { margin: 14px 0 0; color: rgba(255,255,255,.62); font-size: 13px; line-height: 1.8; }
      .fallback-enter { margin-top: 26px; border: 1px solid rgba(232,205,142,.7); border-radius: 99px; background: linear-gradient(100deg,#c8a96a,#f3dfac,#c8a96a); color: #2b1645; padding: 12px 30px; font: inherit; font-size: 12px; font-weight: 700; letter-spacing: .1em; cursor: pointer; }
    </style>
  </head>

  <body>
    <div id="intro" role="dialog" aria-label="拾光里介绍">
      <video id="intro-video" class="intro-video" poster="/web/assets/intro-poster.jpg" preload="auto" muted playsinline autoplay></video>
      <button class="intro-play" type="button" id="intro-play">▶ 播放开场</button>
      <div class="intro-fallback" id="intro-fallback">
        <div class="fallback-mark">拾</div>
        <h1>拾光里</h1>
        <p>让每件失物，都有回家的路。<br>校园公益失物招领与爱心互助平台。</p>
        <button class="fallback-enter" type="button" id="intro-enter">进入拾光里</button>
      </div>
      <div class="intro-head"><div class="intro-brand"><div class="intro-brandmark">拾</div><span>拾光里 · CAMPUS LOST &amp; FOUND</span></div><button class="intro-skip" type="button" id="intro-skip">跳过 ›</button></div>
    </div>

    <script>
      (function () {
        var intro = document.getElementById('intro');
        if (!intro) return;
        var force = new URLSearchParams(location.search).get('intro') === '1';
        var admin = location.pathname.replace(/\/+$/, '') === '/admin';
        var seen = false;
        try { seen = sessionStorage.getItem('sg:intro:v1') === '1'; } catch (e) {}
        if (admin || (!force && seen)) { intro.parentNode.removeChild(intro); return; }

        var video = document.getElementById('intro-video');
        var closed = false;
        var fallbackTimer = null;

        function close() {
          if (closed) return;
          closed = true;
          try { sessionStorage.setItem('sg:intro:v1', '1'); } catch (e) {}
          document.body.style.overflow = '';
          intro.classList.add('is-leaving');
          setTimeout(function () { if (intro.parentNode) intro.parentNode.removeChild(intro); }, 600);
        }
        function fallback() {
          if (closed) return;
          intro.classList.add('fallback-on');
          intro.classList.remove('need-play');
          if (video) { try { video.pause(); } catch (e) {} }
        }
        function needPlay() {
          if (closed) return;
          intro.classList.add('need-play');
        }
        function markSeen() { try { sessionStorage.setItem('sg:intro:v1', '1'); } catch (e) {} }

        document.body.style.overflow = 'hidden';
        document.getElementById('intro-skip').addEventListener('click', close);
        document.getElementById('intro-enter').addEventListener('click', close);
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

        if (video) {
          var useMobile = (window.innerWidth <= 820) || (window.innerHeight > window.innerWidth && window.innerWidth < 1000);
          video.src = useMobile ? '/web/assets/intro-mobile.mp4?v=20261127' : '/web/assets/intro.mp4?v=20261127';
          if (useMobile) video.poster = '/web/assets/intro-mobile-poster.jpg?v=20261127';
          video.addEventListener('ended', close);
          video.addEventListener('error', fallback);
          var play = video.play();
          if (play && play.catch) play.catch(needPlay);
          document.getElementById('intro-play').addEventListener('click', function () {
            intro.classList.remove('need-play');
            var p2 = video.play();
            if (p2 && p2.catch) p2.catch(fallback);
          });
          fallbackTimer = setTimeout(function () {
            if (!closed && video.readyState < 2) fallback();
          }, 7000);
        } else {
          fallback();
        }
      })();
    </script>
